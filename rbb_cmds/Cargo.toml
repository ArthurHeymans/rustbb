[package]
name = "rbb-cmds"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multicall rescue userland for Rust initramfs images"

[[bin]]
name = "rbb"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rbb-init = { path = "../rbb_init" }
rbb-boot = { path = "../rbb_boot" }

rbb-manifest = { path = "../rbb_manifest" }

[build-dependencies]
rbb-manifest = { path = "../rbb_manifest" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
