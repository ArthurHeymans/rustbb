[package]
name = "rbb-cmds"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multicall rescue userland for Rust initramfs images"

[[bin]]
name = "rbb"
path = "src/main.rs"

[features]
default = []
rescue-tools = ["coreutils", "brush"]
brush = ["dep:brush-shell", "dep:brush-core", "dep:clap", "dep:uu_printf", "dep:uu_test", "dep:uucore"]
coreutils = ["dep:uucore", "dep:uu_cat", "dep:uu_ls", "dep:uu_cp", "dep:uu_rm", "dep:uu_mkdir", "dep:uu_ln", "dep:uu_chmod", "dep:uu_readlink", "dep:uu_head", "dep:uu_tail", "dep:uu_wc", "dep:uu_cut", "dep:uu_sort", "dep:uu_uniq", "dep:uu_tee", "dep:uu_tr", "dep:uu_env", "dep:uu_printenv", "dep:uu_mktemp", "dep:uu_timeout", "dep:uu_dd", "dep:uu_sync", "dep:uu_mknod", "dep:uu_mkfifo", "dep:uu_touch", "dep:uu_sha256sum", "dep:uu_printf", "dep:uu_test"]

[dependencies]
libc = "0.2"
rbb-init = { path = "../rbb_init" }
rbb-boot = { path = "../rbb_boot" }

rbb-manifest = { path = "../rbb_manifest" }

brush-core = { version = "0.5.0", optional = true }
clap = { version = "4", optional = true }
brush-shell = { version = "0.4.0", default-features = false, features = ["minimal"], optional = true }
uucore = { version = "0.12.0", default-features = false, optional = true }
uu_test = { version = "0.12.0", default-features = false, optional = true }
uu_printf = { version = "0.12.0", default-features = false, optional = true }
uu_cat = { version = "0.12.0", default-features = false, optional = true }
uu_ls = { version = "0.12.0", default-features = false, optional = true }
uu_cp = { version = "0.12.0", default-features = false, optional = true }
uu_rm = { version = "0.12.0", default-features = false, optional = true }
uu_mkdir = { version = "0.12.0", default-features = false, optional = true }
uu_ln = { version = "0.12.0", default-features = false, optional = true }
uu_chmod = { version = "0.12.0", default-features = false, optional = true }
uu_readlink = { version = "0.12.0", default-features = false, optional = true }
uu_head = { version = "0.12.0", default-features = false, optional = true }
uu_tail = { version = "0.12.0", default-features = false, optional = true }
uu_wc = { version = "0.12.0", default-features = false, optional = true }
uu_cut = { version = "0.12.0", default-features = false, optional = true }
uu_sort = { version = "0.12.0", default-features = false, optional = true }
uu_uniq = { version = "0.12.0", default-features = false, optional = true }
uu_tee = { version = "0.12.0", default-features = false, optional = true }
uu_tr = { version = "0.12.0", default-features = false, optional = true }
uu_env = { version = "0.12.0", default-features = false, optional = true }
uu_printenv = { version = "0.12.0", default-features = false, optional = true }
uu_mktemp = { version = "0.12.0", default-features = false, optional = true }
uu_timeout = { version = "0.12.0", default-features = false, optional = true }
uu_dd = { version = "0.12.0", default-features = false, optional = true }
uu_sync = { version = "0.12.0", default-features = false, optional = true }
uu_mknod = { version = "0.12.0", default-features = false, optional = true }
uu_mkfifo = { version = "0.12.0", default-features = false, optional = true }
uu_touch = { version = "0.12.0", default-features = false, optional = true }
uu_sha256sum = { version = "0.12.0", default-features = false, optional = true }

[build-dependencies]
rbb-manifest = { path = "../rbb_manifest" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
