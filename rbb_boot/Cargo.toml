[package]
name = "rbb-boot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux early-boot device discovery, root handoff and boot loading"

[dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["mount", "fs", "process", "reboot"] }
serde = { version = "1", features = ["derive"] }
ext4-view = { version = "1", features = ["std"] }
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
gptman = "3"
mbrman = "0.6"
glob = "0.3"
flate2 = "1"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "xz"] }

toml = "0.8"
tempfile = "3"
boot-loader-spec = "0.1.5"
sha2 = "0.11"
shlex = "1.3"
mozim = { path = "../vendor/mozim", version = "0.3.3" }
rtnetlink = "0.23"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "net", "time"] }
ipnet = "2"
url = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
tftp_client = "0.3"
percent-encoding = "2"
ed25519-dalek = "3"
serde_json = "1"

[target.'cfg(target_arch = "x86_64")'.dependencies]
kexec-loader = "0.17"
