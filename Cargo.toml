[workspace]
resolver = "2"
exclude = ["vendor/mozim"]
members = [
    "rustbb",
    "rustbb_runtime",
    "rbb_init",
    "rbb_boot",
    "rbb_cmds",
    "rbb_mkimage",
    "examples/simple_echo",
    "examples/simple_cat",
    "examples/head",
    "examples/wc",
    "examples/async_hello",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
