[package]
name = "rbb-init"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Small PID 1 and foreground service supervisor for Rust initramfs images"

[dependencies]
libc = "0.2"
rbb-boot = { path = "../rbb_boot" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
